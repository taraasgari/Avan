map $http_x_forwarded_proto $avan_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $binary_remote_addr zone=avan_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=avan_login:10m rate=8r/m;

upstream avan_web {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /account/login/ {
        limit_req zone=avan_login burst=5 nodelay;
        proxy_pass http://avan_web;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $avan_forwarded_proto;
    }

    location /api/ {
        limit_req zone=avan_api burst=60 nodelay;
        proxy_pass http://avan_web;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $avan_forwarded_proto;
    }

    location / {
        proxy_pass http://avan_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $avan_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
