<div
    class="cart-overlay"
    data-cart-overlay
></div>


<aside
    class="cart-drawer"
    data-cart-drawer
    aria-label="Shopping bag"
>

    <div class="cart-drawer__head">

        <div>
            <span>AVAN</span>

            <h2>
                YOUR BAG
                <small data-cart-drawer-count>0</small>
            </h2>
        </div>

        <button
            type="button"
            class="cart-close"
            data-cart-close
            aria-label="Close bag"
        >
            ×
        </button>

    </div>


    <div
        class="cart-drawer__items"
        data-cart-drawer-items
    >

        <div class="cart-loading">
            LOADING...
        </div>

    </div>


    <div
        class="cart-drawer__footer"
        data-cart-drawer-footer
    >

        <div class="cart-drawer-total">

            <span>SUBTOTAL</span>

            <strong>
                <span data-cart-drawer-total>0</span>
                <small>TOMAN</small>
            </strong>

        </div>


        <a
            href="/bag/"
            class="cart-view-bag"
        >
            VIEW BAG
        </a>

        <a
            href="/checkout/"
            class="cart-checkout"
        >
            CHECKOUT →
        </a>

    </div>

</aside>
