name: AVAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avan_test
          POSTGRES_USER: avan
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avan -d avan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-AVAN-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      POSTGRES_DB: avan_test
      POSTGRES_USER: avan
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      ENABLE_REDIS_CACHE: "1"
      AVAN_PRODUCTION_SECURE: "1"
      AVAN_BEHIND_HTTPS_PROXY: "1"
      AVAN_CSP_ENFORCE: "1"
      AVAN_MANIFEST_STATIC: "1"
      AVAN_METRICS_TOKEN: ci-metrics-token-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_ADMIN_URL: ci-control-panel/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py check --deploy
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
      - run: python manage.py launch_check --strict
      - run: python manage.py avan_smoke_test --host=localhost

  production-image:
    runs-on: ubuntu-latest
    needs: django
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: false
          tags: avan:ci
